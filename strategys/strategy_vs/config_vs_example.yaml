# 跨所价差对比策略（strategy_vs）
# 策略核心同一套代码，可回测（CSV）也可实盘（--dry-run / 实盘）
#
# 回测:
#   python -m strategys.strategy_vs.vs_backtest -c strategys/strategy_vs/config_vs_example.yaml
# 实盘 dry-run（只打印，不下单）:
#   python -m strategys.strategy_vs.vs_live -c strategys/strategy_vs/config_vs_example.yaml --dry-run
# 实盘:
#   python -m strategys.strategy_vs.vs_live -c strategys/strategy_vs/config_vs_example.yaml

# ============ 数据（回测用；交易所名与 data/{exchange}/ 对应）============
backtest:
  data_dir: data
  exchange_a: arcus          # 腿 A（信号腿；下单在这里）
  exchange_b: ondo           # 腿 B（对冲腿；对冲在这里）
  pair_a: BTC-USD            # 会映射 data/arcus/BTC_USD-5m.csv
  pair_b: BTC-USD.P          # data/ondo/BTC_USD.P-5m.csv
  timeframe: 5m
  timerange: ""              # 例 20260703- ；空则两边交集
  fee_rate_a: 0.0002         # taker/maker 简化费率
  fee_rate_b: 0.0002
  initial_cash: 1000      # 每腿初始资金（合计 = 2 * initial_cash）
  use_bidask_for_spread: true
  # true: 价差按 close*(1±spread_bps/2) 近似盘口
  # false: 价差用 close 直接比（更粗）
  # 回测撮合：单腿限价按 high/low 是否触及

# ============ 策略参数（回测/实盘共用）============
strategy:
  symbol: BTC
  order_size: 0.002
  max_position_size: 0.02

  # 阈值模式:
  #   fixed    — 用下面 min/max_profit_pct（写死）
  #   quantile — 滚动 lookback 内分位数自适应（推荐起步）
  #   zscore   — 滚动均值±Nσ
  threshold_mode: quantile
  lookback: 288              # 5m*288 ≈ 1 天
  open_q: 0.90               # 开仓：价差 > 历史 90% 分位
  close_q: 0.20              # 平仓：价差 < 历史 20% 分位
  open_z: 2.0                # zscore 模式：开仓 mean+2σ
  close_z: 0.0               # zscore 模式：平仓 mean+0σ
  min_edge: 0.0003           # 自适应下限（约覆盖双边费率）

  # fixed 模式兜底（warmup 不够时也用）
  min_profit_pct: 0.0005
  max_profit_pct: 0.003
  use_dynamic_profit_window: false   # 旧 compara 漂移窗口；threshold_mode=fixed 时才有意义
  profit_buffer_pct: 0.0

  hedge_threshold: 1e-8
  hedge_cooldown_sec: 2.0
  spread_bps: 2              # 模拟盘口半档（仅回测近似 bid/ask）

# ============ 实盘连接（回测忽略；密钥放 .generated/*.json）============
exchanges:
  arcus:
    exchange_name: arcus
    network: mainnet
    timeout: 15
    symbol: BTC-USD
  ondo:
    exchange_name: ondo
    network: mainnet
    timeout: 15
    symbol: BTC-USD.P

# ============ 实盘行为 ============
live:
  legs:
    a: arcus                 # 对应 exchanges 下的键
    b: ondo
  pair_a: BTC-USD
  pair_b: BTC-USD.P
  poll_interval_sec: 2.0
  hedge_exchange: b          # 对冲腿
  order_exchange: a          # 限价信号腿

telegram:
  enable: false
