# Ondo Perps 网格配置示例
# 密钥请写在仓库根目录 .generated/ondo.json
# 用法:
#   cd strategys/strategy_grid
#   python grid_mm.py -c config_ondo.yaml -e ondo

exchanges:
  ondo:
    exchange_name: ondo
    network: mainnet
    timeout: 15
    # Ondo 市场名：AAPL-USD.P（策略会 normalize）
    symbol: CRCL-USD.P

grid:
  # mode: neutral | long | short
  mode: long
  upper_price: 80
  lower_price: 60
  price_step: 0.5
  close_step_mult: 2
  grid_count: 10
  order_quantity: 1
  sleep_interval: 5
  max_position_multiplier: 10

risk:
  enable: false
  interval: 4h
  kline_limit: 72
  adx:
    enable: true
    period: 14
    flatten_gt: 30
    double_gt: 25
    double_lt: 30
  rsi:
    enable: true
    period: 14
    flatten_lt: 30
    flatten_gt: 70
    double_lt: 40
    double_gt: 60

schedule:
  enable: false
  timezone: Asia/Hong_Kong
  blackout:
    mon: []
    tue: []
    wed: []
    thu: []
    fri: []
    sat: []
    sun: []

telegram:
  enable: false
  interval_seconds: 3600
  bot_token: ""
  chat_id: ""
  message_format: "[{exchange}余额] {balance}U"
