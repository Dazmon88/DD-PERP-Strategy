# Arcus 网格策略配置示例
# 密钥请写在仓库根目录 .generated/arcus.json：
#   {
#     "api_key": "<Ed25519 公钥，可选，不填则由 api_secret 推导>",
#     "api_secret": "<Ed25519 API 签名私钥>",
#     "address": "<主钱包地址 0x...>",
#     "account_index": 0
#   }
# 日常交易只需 API Key 对，不需要主钱包私钥。
# 首次注册 API Key 才需钱包 EIP-712（见 arcus_protocol.account.create_api_key）。
#
# 用法:
#   cd strategys/strategy_grid
#   python grid_mm.py -c config_arcus.yaml -e arcus

exchanges:
  arcus:
    exchange_name: arcus
    network: testnet
    timeout: 15
    # Arcus 市场名：BTC-USD（也可用 BTC / BTCUSDT，策略会 normalize）
    symbol: BTC-USD

grid:
  # mode: neutral | long | short
  mode: neutral
  upper_price: 100000
  lower_price: 10000
  price_step: 10
  grid_count: 5
  order_quantity: 0.001
  # Arcus REST 按 IP 计 weight；openOrders=20，轮询过密易触发 Cloudflare 429
  sleep_interval: 15
  max_position_multiplier: 5

risk:
  enable: false
  interval: 4h
  kline_limit: 72
  adx:
    enable: true
    period: 14
    flatten_gt: 30
    double_gt: 25
    double_lt: 30
  rsi:
    enable: true
    period: 14
    flatten_lt: 30
    flatten_gt: 70
    double_lt: 40
    double_gt: 60

schedule:
  enable: false
  timezone: Asia/Hong_Kong
  blackout:
    mon: []
    tue: []
    wed: []
    thu: []
    fri: []
    sat: []
    sun: []

telegram:
  enable: false
  interval_seconds: 3600
  bot_token: ""
  chat_id: ""
  message_format: "[{exchange}余额] {balance}U"
