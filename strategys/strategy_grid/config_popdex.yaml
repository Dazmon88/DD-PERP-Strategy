# PopDEX 网格策略配置示例
# 密钥请写在仓库根目录 .generated/popdex.json
# 用法:
#   cd strategys/strategy_grid
#   python grid_mm.py -c config_popdex.yaml -e popdex

exchanges:
  popdex:
    exchange_name: popdex
    network: mainnet
    category: Futures
    timeout: 15
    # PopDEX 交易对：BTCUSDT；也可用 BTC-USDT（策略会 normalize）
    symbol: BTC-USDT

grid:
  # mode: neutral | long | short
  mode: long
  upper_price: 100000
  lower_price: 10000
  price_step: 50
  close_step_mult: 2
  grid_count: 20
  order_quantity: 0.001
  # 链上确认稍慢，建议 >= 5
  sleep_interval: 8
  max_position_multiplier: 20

risk:
  enable: false
  interval: 4h
  kline_limit: 72
  adx:
    enable: true
    period: 14
    flatten_gt: 30
    double_gt: 25
    double_lt: 30
  rsi:
    enable: true
    period: 14
    flatten_lt: 30
    flatten_gt: 70
    double_lt: 40
    double_gt: 60

schedule:
  enable: false
  timezone: Asia/Hong_Kong
  blackout:
    mon: []
    tue: []
    wed: []
    thu: []
    fri: []
    sat: []
    sun: []

telegram:
  enable: false
  interval_seconds: 3600
  bot_token: ""
  chat_id: ""
  message_format: "[{exchange}余额] {balance}U (持仓价值 {position_value}U)"
